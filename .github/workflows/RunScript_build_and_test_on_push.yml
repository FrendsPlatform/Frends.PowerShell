name: Frends.PowerShell.RunScript Test

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'Frends.PowerShell.RunScript/**'
      - '.github/workflows/RunScript*.yml'
  workflow_dispatch:

jobs:
  work_push:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: work
      os: all
      workdir: Frends.PowerShell.RunScript
      strict_analyzers: false
      pretest_command: if ($IsWindows) { Add-Content -Path $env:GITHUB_ENV -Value 'PSExecutionPolicyPreference=Unrestricted' }
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
      target_feed_api_key: ${{ secrets.TASKS_TEST_FEED_API_KEY }}
