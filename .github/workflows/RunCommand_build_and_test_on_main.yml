name: Frends.PowerShell.RunCommand Main

on:
  push:
    branches:
      - main
    paths:
      - 'Frends.PowerShell.RunCommand/**'
      - '.github/workflows/RunCommand*.yml'
  workflow_dispatch:

jobs:
  main_test:
    uses: FrendsPlatform/FrendsTasks/.github/workflows/official_task_pipeline.yml@main
    with:
      workflow_mode: main
      os: all
      workdir: Frends.PowerShell.RunCommand
      strict_analyzers: 'false'
    secrets:
      badge_service_api_key: ${{ secrets.BADGE_SERVICE_API_KEY }}
